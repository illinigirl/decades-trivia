AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Decades Trivia - RAG-grounded trivia study app (Bedrock + Lambda + DynamoDB)

Parameters:
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM cert ARN for the custom domain (leave blank to skip domain)
  DomainName:
    Type: String
    Default: ""
    Description: Custom domain, e.g. trivia.megillini.dev
  CorpusVersion:
    Type: String
    Default: "1"
    Description: Bumped each deploy to force a cold start so new corpus is re-fetched

Conditions:
  HasDomain: !Not [!Equals [!Ref CertificateArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 1024

Resources:

  CorpusBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  StatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  TriviaApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Same-origin frontend + API, so no CORS config needed.
      StageName: $default

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: api.app.handler
      Environment:
        Variables:
          CORPUS_BUCKET: !Ref CorpusBucket
          CORPUS_DIR: /tmp/corpus
          STATS_TABLE: !Ref StatsTable
          CORPUS_VERSION: !Ref CorpusVersion   # change forces new containers
      Policies:
        - S3ReadPolicy: { BucketName: !Ref CorpusBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref StatsTable }
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref TriviaApi
            Path: "/"
            Method: GET
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref TriviaApi
            Path: "/{proxy+}"
            Method: ANY

  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    Properties:
      ApiId: !Ref TriviaApi
      DomainName: !Ref ApiDomain
      Stage: "$default"

Outputs:
  ApiUrl:
    Description: Open this in a browser
    Value: !Sub "https://${TriviaApi}.execute-api.${AWS::Region}.amazonaws.com/"
  CorpusBucket:
    Description: Upload corpus/*.json and *.f32 here under the corpus/ prefix
    Value: !Ref CorpusBucket
  CustomDomainTarget:
    Condition: HasDomain
    Description: Point your subdomain CNAME at this (Cloudflare, DNS-only/grey)
    Value: !GetAtt ApiDomain.RegionalDomainName
